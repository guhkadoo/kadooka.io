<mat-toolbar color="primary" [class.dark-theme]="isDarkMode">
  <button
    mat-button
    type="button"
    routerLink="/"
  >
    <span class="mdi mdi-home" style="font-size: 24px;"></span>
  </button>

  <span class="title">Gustavo Kadooka</span>
  <button
    mat-button
    type="button"
    (click)="toggleSettings()"
  >
    <span class="mdi mdi-cog" style="font-size: 24px;"></span>
  </button>
</mat-toolbar>

<div class="settings-panel" [class.dark-theme]="isDarkMode" *ngIf="isSettingsOpen">
  <div class="settings-header">
    <h2>{{ 'app.configurations' | translate }}</h2>

    <button
      mat-button
      type="button"
      (click)="toggleSettings()"
    >
      <span class="mdi mdi-close" style="font-size: 18px;"></span>
    </button>
  </div>

  <div class="settings-section">
    <label>{{ 'app.theme' | translate }}</label>

    <div class="settings-options">
      <button
        mat-stroked-button
        [class.selected]="!isDarkMode"
        (click)="setDarkMode(false)"
      >
        {{ 'app.light' | translate }}
      </button>

      <button
        mat-stroked-button
        [class.selected]="isDarkMode"
        (click)="setDarkMode(true)"
      >
        {{ 'app.dark' | translate }}
      </button>
    </div>
  </div>

  <div class="settings-section">
    <label>{{ 'app.language' | translate }}</label>

    <div class="settings-options">
      <button
        mat-stroked-button
        [class.selected]="selectedLanguage === 'en'"
        (click)="selectLanguage('en')"
      >
        EN
      </button>

      <button
        mat-stroked-button
        [class.selected]="selectedLanguage === 'pt'"
        (click)="selectLanguage('pt')"
      >
        PT
      </button>
    </div>
  </div>

  <div class="settings-section">
    <label>{{ 'app.color' | translate }}</label>

    <div class="color-options">
      <button
        *ngFor="let color of colors"
        type="button"
        class="color-option"
        [class.selected]="selectedColor === color.value"
        [style.background-color]="'var(--theme-' + color.value + '-' + (isDarkMode ? 'dark' : 'light') + ')'"
        (click)="selectColor(color.value)"
      ></button>

    </div>
  </div>
</div>

<router-outlet />
