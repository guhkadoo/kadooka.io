<div>
  <h1>{{ name() }}</h1>
  <input type="text" [value]="name()" (input)="name.set($event.target.value)" />
  <button mat-raised-button color="primary" (click)="setTheme('light-blue-theme')">Light Blue Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('dark-blue-theme')">Dark Blue Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('light-red-theme')">Light Red Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('dark-red-theme')">Dark Red Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('light-green-theme')">Light Green Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('dark-green-theme')">Dark Green Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('light-yellow-theme')">Light Yellow Theme</button>
  <button mat-raised-button color="primary" (click)="setTheme('dark-yellow-theme')">Dark Yellow Theme</button>
</div>

<router-outlet />
