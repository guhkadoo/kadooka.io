name: Front CI/CD

on:
  push:
    branches:
      - PROD
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' 

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: |
          npm run lint || echo "Linting step skipped (no lint script)"
        continue-on-error: true

      - name: Run Tests
        run: |
          npm test || echo "Tests skipped (no test script)"
        continue-on-error: true

      - name: Build Application
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -d "dist/kadooka_io" ]; then
            echo "Build output not found!"
            exit 1
          fi
          echo "Build successful!"

  CD:
    needs: CI
    runs-on: ubuntu-latest
      
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete dist/kadooka_io/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/app.kadooka.io

      - name: Verify Deployment
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            if [ ! -f /var/www/app.kadooka.io/browser/index.html ]; then
              echo "Deployment verification failed: index.html not found"
              exit 1
            fi
            echo "Deployment verified successfully!"
          EOF

      - name: Health Check (Optional)
        run: |
          sleep 3
          curl -f https://app.kadooka.io/ || echo "Health check skipped"
        continue-on-error: true